pipeline_name: commons_tragedy_3_agent_test
env_modules:
- module_type: CommonsTragedyEnv
  kwargs:
    num_agents: 3
    initial_pool_resources: 120
agents:
- agent_id: 1
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 1
    name: Node 001 (Maximizer)
    persona: You prioritize your own immediate profit above all else. You believe
      exploiting the resource heavily and quickly is your right, and you assume others
      are doing the same. Your goal is to extract the maximum possible amount before
      the resource runs out.
    num_rounds: 3
    write_llm_debug_log: true
- agent_id: 2
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 2
    name: Node 002 (Skeptical Follower)
    persona: You are cautious and highly influenced by the group's past behavior.
      You start conservatively, but if you see others taking more than their fair
      share, you will match their rate. You do not want to be a 'sucker' who conserves
      while others profit.
    num_rounds: 3
    write_llm_debug_log: true
- agent_id: 3
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 3
    name: Node 003 (Steward)
    persona: You believe in sustainable management for long-term collective benefit.
      You will extract conservatively and advocate for others to do the same. You
      are willing to sacrifice some short-term gain to ensure the resource endures.
    num_rounds: 3
    write_llm_debug_log: true
codegen_router:
  final_summary_enabled: false
metrics:
  pricing:
    input_cost_per_1k_tokens: null
    output_cost_per_1k_tokens: null
