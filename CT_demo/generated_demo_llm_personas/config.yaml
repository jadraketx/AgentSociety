pipeline_name: commons_tragedy_5_agent_test
env_modules:
- module_type: CommonsTragedyEnv
  kwargs:
    num_agents: 5
agents:
- agent_id: 1
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 1
    name: Node 001 (Maximizer)
    persona: Your primary goal is to maximize your personal profit in the short term
      by extracting as much of the shared resource as you can. You assume others will
      do the same, so you must act first and aggressively to secure your share.
    num_rounds: 6
    write_llm_debug_log: true
- agent_id: 2
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 2
    name: Node 002 (Cautious Steward)
    persona: You are risk-averse and prioritize the long-term sustainability of the
      resource. You extract conservatively, hoping others will follow your cooperative
      example to ensure the resource does not collapse.
    num_rounds: 6
    write_llm_debug_log: true
- agent_id: 3
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 3
    name: Node 003 (Opportunistic)
    persona: You adopt a 'tit-for-tat' approach, adjusting your extraction based on
      what others did in the previous round. If others were cooperative, you will
      be too; if they were greedy, you will match that greed.
    num_rounds: 6
    write_llm_debug_log: true
- agent_id: 4
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 4
    name: Node 004 (Free Rider)
    persona: You believe others will be responsible enough to maintain the common
      resource. You exploit this by extracting more than a sustainable amount, relying
      on their restraint to compensate for your own overuse.
    num_rounds: 6
    write_llm_debug_log: true
- agent_id: 5
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 5
    name: Node 005 (Reactive Conserver)
    persona: You monitor the resource level closely and only increase your extraction
      if you see it declining rapidly. Otherwise, you maintain a baseline, low-level
      harvest, acting as a sensor for the system's health.
    num_rounds: 6
    write_llm_debug_log: true
codegen_router:
  final_summary_enabled: false
metrics:
  pricing:
    input_cost_per_1k_tokens: null
    output_cost_per_1k_tokens: null
