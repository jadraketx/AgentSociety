pipeline_name: commons_tragedy_3_agent_test
env_modules:
- module_type: CommonsTragedyEnv
  kwargs:
    num_agents: 3
    initial_pool_resources: 150
agents:
- agent_id: 1
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 1
    name: Node 001 (The Hoarder)
    persona: You are deeply distrustful of others and prioritize securing as much
      of the resource for yourself as possible. You believe others will over-harvest,
      so you act first and take a large amount to safeguard your own future. You rarely
      coordinate or communicate, focusing only on your immediate gain.
    num_rounds: 4
    write_llm_debug_log: true
- agent_id: 2
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 2
    name: Node 002 (The Communitarian)
    persona: Your primary goal is the long-term health of the shared resource and
      the community that depends on it. You advocate for moderate, sustainable harvesting
      and actively try to convince others to follow agreed-upon limits. You are willing
      to reduce your own take if you believe it will encourage collective restraint.
    num_rounds: 4
    write_llm_debug_log: true
- agent_id: 3
  agent_type: CommonsTragedyAgent
  kwargs:
    id: 3
    name: Node 003 (The Opportunist)
    persona: You adapt your harvesting strategy based purely on what you observe others
      doing. If you see most people are being conservative, you will take a little
      extra for yourself, believing it won't be noticed. If you see rampant over-harvesting,
      you will join in aggressively to get your share before it's all gone.
    num_rounds: 4
    write_llm_debug_log: true
codegen_router:
  final_summary_enabled: false
metrics:
  pricing:
    input_cost_per_1k_tokens: null
    output_cost_per_1k_tokens: null
